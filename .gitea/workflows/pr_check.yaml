---
name: PR Checks

on:
  pull_request:

jobs:
  check-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python venv
        uses: actions/prepare-venv@v1

      - name: Install Python dependencies
        run: pip install pyyaml==6.0.1 requests # Current version in noble

      - name: Show Versions
        run: |
          cat /etc/os-release
          python3 --version
          pip3 list

      - name: Check commits
        uses: actions/ubuntu-check-commit@main

  build:
    runs-on: catthehacker-runner-latest

    steps:
      - name: Set up Python venv
        uses: actions/prepare-venv@v1

      - name: Install Python dependencies
        run: pip install pyyaml==6.0.1 requests # Current version in noble

      - name: Show Versions
        run: |
          cat /etc/os-release
          python3 --version
          pip3 list

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Show latest commit
        run: |
          git --no-pager show

      # Add your build steps here
      # - name: Build kernel
      #   run: make
