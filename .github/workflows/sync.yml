name: Sync remote git repositories
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      manual_urls:
        description: 'Override Source URLs (newline-separated, optional)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sync-workflow
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Push
        env:
          INPUT_URLS: ${{ github.event.inputs.manual_urls }}
          VAR_URLS: ${{ vars.SOURCE_REPO_URLS }}
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          PUSH_URL="https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git"

          # Build the list of source URLs.
          # manual_urls (workflow_dispatch input) takes priority; fall back to
          # the SOURCE_REPO_URLS repository variable.  Both accept multiple
          # URLs separated by newlines, commas, or spaces.
          RAW_URLS="${INPUT_URLS:-$VAR_URLS}"

          # Normalise separators: replace commas and spaces with newlines,
          # then drop blank lines.
          URLS=$(echo "$RAW_URLS" | tr -d '\r' | tr ',' '\n' | tr ' ' '\n' | sed '/^$/d')

          if [ -z "$URLS" ]; then
            echo "::error::No source URLs configured. Set the SOURCE_REPO_URLS variable or provide manual_urls."
            exit 1
          fi

          echo "Default branch: $DEFAULT_BRANCH"
          echo "---"
          echo "Source URLs:"
          echo "$URLS"
          echo "---"

          # Collect every branch name we push so we can detect duplicates.
          SEEN_BRANCHES_FILE=$(mktemp)
          REMOTE_INDEX=0
          PRIMARY_REMOTE=""

          while IFS= read -r SOURCE_URL; do
            REMOTE_INDEX=$((REMOTE_INDEX + 1))
            REMOTE_NAME="upstream${REMOTE_INDEX}"

            echo ""
            echo "========================================="
            echo "Processing remote $REMOTE_NAME: $SOURCE_URL"
            echo "========================================="

            # The first remote is the "primary" one whose default branch is
            # used for the rebase step later.
            if [ "$REMOTE_INDEX" -eq 1 ]; then
              PRIMARY_REMOTE="$REMOTE_NAME"
            fi

            # Add and fetch the remote
            git remote add "$REMOTE_NAME" "$SOURCE_URL"
            git fetch "$REMOTE_NAME" --tags --prune

            # Push all branches from this remote (except the default branch)
            git for-each-ref "refs/remotes/${REMOTE_NAME}" --format='%(refname)' | while read ref; do
              branch_name="${ref#refs/remotes/${REMOTE_NAME}/}"

              # Skip the HEAD pointer if present
              if [ "$branch_name" = "HEAD" ]; then
                continue
              fi

              if [ "$branch_name" = "$DEFAULT_BRANCH" ]; then
                echo "Skipping default branch: $branch_name"
                continue
              fi

              # Check for duplicate branch names across remotes
              if grep -qx "$branch_name" "$SEEN_BRANCHES_FILE" 2>/dev/null; then
                echo "::error::Duplicate branch name detected: '$branch_name' (already synced from a previous remote)"
                exit 1
              fi

              echo "$branch_name" >> "$SEEN_BRANCHES_FILE"
              git push "$PUSH_URL" "$ref:refs/heads/$branch_name" --force
            done

          done <<< "$URLS"

          rm -f "$SEEN_BRANCHES_FILE"

          # Push all tags (from every remote that was fetched)
          git push "$PUSH_URL" --tags --force

          # Rebase onto the primary upstream's default branch and push
          echo ""
          echo "Rebasing sync-workflow onto ${PRIMARY_REMOTE}/${DEFAULT_BRANCH}"
          git rebase --onto "refs/remotes/${PRIMARY_REMOTE}/${DEFAULT_BRANCH}" --root HEAD
          git push "$PUSH_URL" HEAD:"refs/heads/$DEFAULT_BRANCH" --force
