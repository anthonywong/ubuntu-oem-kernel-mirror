name: Sync remote git repository
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      manual_url:
        description: 'Override Source URL (Optional)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch and Push
        run: |
          # 1. Determine the URL
          SOURCE_URL="${{ github.event.inputs.manual_url || vars.SOURCE_REPO_URL }}"
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          echo "Syncing from: $SOURCE_URL"
          echo "Current workflow branch to protect: $CURRENT_BRANCH"
          
          # 2. Add the dynamic remote
          git remote add upstream "$SOURCE_URL"
          
          # 3. Fetch all data from Launchpad
          # We use --prune to remove branches that no longer exist upstream
          git fetch upstream --tags --prune
          
          # 4. Filtered Push
          # We push all upstream refs EXCEPT the one matching our current branch name
          # This prevents the workflow file from being overwritten.
          git for-each-ref refs/remotes/upstream --format='%(refname)' | while read ref; do
            branch_name="${ref#refs/remotes/upstream/}"
            
            if [ "$branch_name" == "$CURRENT_BRANCH" ]; then
              echo "Skipping protected branch: $branch_name"
              continue
            fi
            
            # Map 'upstream/branch' to 'origin/branch'
            git push https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git \
              "$ref:refs/heads/$branch_name" --force
          done

          # 5. Push tags separately
          git push https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git --tags --force
