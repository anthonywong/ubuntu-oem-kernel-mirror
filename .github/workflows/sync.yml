name: Sync remote git repository
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      manual_url:
        description: 'Override Source URL (Optional)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sync-workflow
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch and Push
        run: |
          # 1. Determine the URL
          SOURCE_URL="${{ github.event.inputs.manual_url || vars.SOURCE_REPO_URL }}"
          DEFAULT_BRANCH="${{ vars.DEFAULT_BRANCH }}"
          PUSH_URL="https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git"

          echo "Syncing from: $SOURCE_URL"
          echo "Default branch: $DEFAULT_BRANCH"

          # 2. Add the dynamic remote
          git remote add upstream "$SOURCE_URL"

          # 3. Fetch all data from upstream
          git fetch upstream --tags --prune

          # 4. Push all upstream branches except the default branch
          git for-each-ref refs/remotes/upstream --format='%(refname)' | while read ref; do
            branch_name="${ref#refs/remotes/upstream/}"

            if [ "$branch_name" == "$DEFAULT_BRANCH" ]; then
              echo "Skipping default branch: $branch_name"
              continue
            fi

            git push "$PUSH_URL" "$ref:refs/heads/$branch_name" --force
          done

          # 5. Push tags
          git push "$PUSH_URL" --tags --force

          # 6. Rebase onto the freshly synced upstream default branch
          #    and push the result to the default branch
          git rebase "refs/remotes/upstream/$DEFAULT_BRANCH"
          git push "$PUSH_URL" HEAD:"refs/heads/$DEFAULT_BRANCH" --force
